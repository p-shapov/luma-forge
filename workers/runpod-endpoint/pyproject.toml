[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "luma-forge-runpod-endpoint-worker"
version = "0.1.0"
description = "RunPod Endpoint Worker for LumaForge ComfyUI generation"
requires-python = ">=3.12"
dependencies = ["runpod>=1,<2"]

[project.optional-dependencies]
dev = []

[tool.setuptools.packages.find]
where = ["src"]
