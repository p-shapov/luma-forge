name: Deploy Endpoint Worker

on:
  push:
    tags:
      - "runpod-endpoint-worker-v*"
  workflow_dispatch:
    inputs:
      provider:
        description: "Endpoint provider"
        required: true
        type: choice
        default: runpod
        options:
          - runpod

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-endpoint-worker-${{ github.ref }}-${{ inputs.provider || 'tag' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate, build, and publish endpoint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve endpoint provider
        id: provider
        env:
          DISPATCH_PROVIDER: ${{ inputs.provider }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          provider="${DISPATCH_PROVIDER:-runpod}"

          if [ "$REF_TYPE" = "tag" ]; then
            case "$REF_NAME" in
              runpod-endpoint-worker-v*) provider="runpod" ;;
              *)
                echo "Unsupported endpoint worker tag: $REF_NAME" >&2
                exit 1
                ;;
            esac
          fi

          case "$provider" in
            runpod)
              worker_dir="workers/runpod-endpoint"
              docker_target="runpod-endpoint"
              image_name="runpod-endpoint-worker"
              ;;
            *)
              echo "Unsupported endpoint provider: $provider" >&2
              exit 1
              ;;
          esac

          printf 'provider=%s\n' "$provider" >> "$GITHUB_OUTPUT"
          printf 'worker_dir=%s\n' "$worker_dir" >> "$GITHUB_OUTPUT"
          printf 'docker_target=%s\n' "$docker_target" >> "$GITHUB_OUTPUT"
          printf 'image_name=%s\n' "$image_name" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate endpoint worker
        working-directory: ${{ steps.provider.outputs.worker_dir }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          PYTHONPATH=src python -m unittest discover -s tests

      - name: Resolve image tags
        id: image
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          IMAGE_NAME: ${{ steps.provider.outputs.image_name }}
        run: |
          base="ghcr.io/$(printf '%s' "${REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          endpoint_image="${base}/${IMAGE_NAME}"
          endpoint_sha_tag="${endpoint_image}:sha-${SHA}"
          endpoint_version_tag=""

          if [ "$REF_TYPE" = "tag" ]; then
            endpoint_version_tag="${endpoint_image}:${REF_NAME}"
          fi

          printf 'endpoint_image=%s\n' "$endpoint_image" >> "$GITHUB_OUTPUT"
          printf 'endpoint_sha_tag=%s\n' "$endpoint_sha_tag" >> "$GITHUB_OUTPUT"
          printf 'endpoint_version_tag=%s\n' "$endpoint_version_tag" >> "$GITHUB_OUTPUT"

      - name: Build endpoint image for validation
        env:
          ENDPOINT_SHA_TAG: ${{ steps.image.outputs.endpoint_sha_tag }}
          ENDPOINT_VERSION_TAG: ${{ steps.image.outputs.endpoint_version_tag }}
          DOCKER_TARGET: ${{ steps.provider.outputs.docker_target }}
        run: |
          docker build --file workers/Dockerfile --target "$DOCKER_TARGET" --tag "$ENDPOINT_SHA_TAG" .
          if [ -n "$ENDPOINT_VERSION_TAG" ]; then
            docker tag "$ENDPOINT_SHA_TAG" "$ENDPOINT_VERSION_TAG"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish endpoint image
        env:
          ENDPOINT_SHA_TAG: ${{ steps.image.outputs.endpoint_sha_tag }}
          ENDPOINT_VERSION_TAG: ${{ steps.image.outputs.endpoint_version_tag }}
        run: |
          docker push "$ENDPOINT_SHA_TAG"
          if [ -n "$ENDPOINT_VERSION_TAG" ]; then
            docker push "$ENDPOINT_VERSION_TAG"
          fi
