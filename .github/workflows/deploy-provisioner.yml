name: Deploy Provisioner

on:
  push:
    tags:
      - "provisioner-worker-v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pull-requests: write

concurrency:
  group: deploy-provisioner-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate, build, and publish provisioner
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Resolve provisioner metadata
        id: contract
        run: |
          python workers/promote-provisioner/release_tool.py resolve-provisioner \
            --catalog bundled/runtime-contracts.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Validate provisioner worker
        run: |
          python -m pip install workers/provisioner
          PYTHONPATH=workers/provisioner/src python -m unittest discover -s workers/provisioner/tests

      - name: Resolve image tag
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          CONTRACT_ID: ${{ steps.contract.outputs.contract_id }}
          CONTRACT_VERSION: ${{ steps.contract.outputs.contract_version }}
        run: |
          base="ghcr.io/$(printf '%s' "${REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          suffix="${CONTRACT_ID}-${CONTRACT_VERSION}"
          printf 'provisioner_tag=%s\n' "${base}/provisioner-worker:${suffix}-sha-${SHA}" >> "$GITHUB_OUTPUT"

      - name: Build provisioner image
        run: |
          docker build --file workers/provisioner/Dockerfile --platform linux/amd64 \
            --tag "${{ steps.image.outputs.provisioner_tag }}" .

      - name: Validate provisioner image
        run: |
          docker run --rm "${{ steps.image.outputs.provisioner_tag }}" sh -c \
            "python -c 'import app.server, auxiliary.huggingface' && ! python -c 'import runpod_endpoint_worker' && ! test -e /opt/luma-forge/runtime/ComfyUI"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish provisioner image
        run: |
          for attempt in 1 2 3; do
            if docker push "${{ steps.image.outputs.provisioner_tag }}"; then
              exit 0
            fi

            if [ "$attempt" = "3" ]; then
              exit 1
            fi

            sleep "$((attempt * 30))"
          done

      - name: Resolve pushed image digest
        id: digest
        run: |
          provisioner_digest="$(docker inspect --format='{{index .RepoDigests 0}}' "${{ steps.image.outputs.provisioner_tag }}")"
          printf 'provisioner_ref=%s\n' "$provisioner_digest" >> "$GITHUB_OUTPUT"

      - name: Promote provisioner image to catalog
        run: |
          python workers/promote-provisioner/release_tool.py promote-provisioner-image \
            --catalog bundled/runtime-contracts.json \
            --workflow-catalog bundled/workflow-catalog.json \
            --contract-version "${{ steps.contract.outputs.contract_version }}" \
            --image-ref "${{ steps.digest.outputs.provisioner_ref }}"

      - name: Verify provisioner promotion PR scope
        run: |
          changed_paths="$(git status --porcelain --untracked-files=all | cut -c4-)"
          if ! printf '%s\n' "$changed_paths" | grep -qx 'bundled/runtime-contracts.json'; then
            echo "::error::Catalog promotion did not modify bundled/runtime-contracts.json"
            exit 1
          fi

          if ! printf '%s\n' "$changed_paths" | grep -qx 'bundled/workflow-catalog.json'; then
            echo "::error::Catalog promotion did not modify bundled/workflow-catalog.json"
            exit 1
          fi

          unexpected_paths="$(printf '%s\n' "$changed_paths" | sed '/^$/d' | grep -Evx 'bundled/(runtime-contracts|workflow-catalog)\.json' || true)"
          if [ -n "$unexpected_paths" ]; then
            echo "::error::Catalog promotion produced unexpected changed paths:"
            printf '%s\n' "$unexpected_paths"
            exit 1
          fi

      - name: Open provisioner promotion PR
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: |
            bundled/runtime-contracts.json
            bundled/workflow-catalog.json
          branch: provisioners/${{ steps.contract.outputs.contract_id }}-${{ steps.contract.outputs.contract_version }}
          title: "chore(workers): promote provisioner image ${{ steps.contract.outputs.contract_id }} ${{ steps.contract.outputs.contract_version }}"
          commit-message: "chore(workers): promote provisioner image ${{ steps.contract.outputs.contract_id }} ${{ steps.contract.outputs.contract_version }}"
          body: |
            Promotes the validated provisioner image and points Workflow Presets at it.

            Published image: `${{ steps.digest.outputs.provisioner_ref }}`
            Catalog version: `${{ steps.contract.outputs.contract_version }}`
          labels: provisioner
