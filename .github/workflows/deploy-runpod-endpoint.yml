name: Deploy RunPod Endpoint

on:
  push:
    tags:
      - "runpod-endpoint-v*"
  workflow_dispatch:
    inputs:
      workflow_id:
        description: Workflow ID
        required: true
        type: string
        default: comfyui-hidream-o1-dev
      workflow_version:
        description: Workflow version
        required: true
        type: string
        default: 1.0.0

permissions:
  contents: write
  packages: write
  pull-requests: write

concurrency:
  group: deploy-runpod-endpoint-${{ github.ref }}-${{ inputs.workflow_id || 'comfyui-hidream-o1-dev' }}-${{ inputs.workflow_version || '1.0.0' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate, build, and publish RunPod endpoint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install release tooling
        run: python -m pip install --upgrade pip pyyaml jsonschema

      - name: Resolve endpoint build metadata
        id: contract
        env:
          WORKFLOW_ID: ${{ inputs.workflow_id || 'comfyui-hidream-o1-dev' }}
          WORKFLOW_VERSION: ${{ inputs.workflow_version || '1.0.0' }}
        run: |
          python workers/promote-runpod-endpoint/release_tool.py resolve \
            --workflow-catalog bundled/workflow-catalog.json \
            --workflow-id "$WORKFLOW_ID" \
            --workflow-version "$WORKFLOW_VERSION" \
            --catalog bundled/runtime-contracts.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Validate workers
        run: |
          python -m pip install workers/provisioner workers/runpod-endpoint pyyaml
          python -m unittest discover -s workers/promote-runpod-endpoint/tests
          PYTHONPATH=workers/runpod-endpoint/src python -m unittest discover -s workers/runpod-endpoint/tests

      - name: Resolve image tags
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          CONTRACT_ID: ${{ steps.contract.outputs.contract_id }}
          CONTRACT_VERSION: ${{ steps.contract.outputs.contract_version }}
        run: |
          base="ghcr.io/$(printf '%s' "${REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          suffix="${CONTRACT_ID}-${CONTRACT_VERSION}"
          printf 'endpoint_tag=%s\n' "${base}/runpod-endpoint-worker:${suffix}-sha-${SHA}" >> "$GITHUB_OUTPUT"

      - name: Build endpoint image
        run: |
          docker build --file workers/runpod-endpoint/Dockerfile --platform linux/amd64 \
            --build-arg LUMA_FORGE_RUNTIME_PYTHON_VERSION="${{ steps.contract.outputs.runtime_python_version }}" \
            --build-arg LUMA_FORGE_COMFYUI_REVISION="${{ steps.contract.outputs.comfyui_revision }}" \
            --build-arg LUMA_FORGE_PYTORCH_INDEX_URL="${{ steps.contract.outputs.pytorch_index_url }}" \
            --build-arg LUMA_FORGE_PYTORCH_PACKAGES_JSON='${{ steps.contract.outputs.pytorch_packages_json }}' \
            --build-arg LUMA_FORGE_BUNDLED_WORKFLOW_PATH="${{ steps.contract.outputs.bundled_workflow_path }}" \
            --tag "${{ steps.image.outputs.endpoint_tag }}" .

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish endpoint image
        run: |
          for attempt in 1 2 3; do
            if docker push "${{ steps.image.outputs.endpoint_tag }}"; then
              exit 0
            fi

            if [ "$attempt" = "3" ]; then
              exit 1
            fi

            sleep "$((attempt * 30))"
          done

      - name: Resolve pushed image digests
        id: digest
        run: |
          endpoint_digest="$(docker inspect --format='{{index .RepoDigests 0}}' "${{ steps.image.outputs.endpoint_tag }}")"
          printf 'endpoint_ref=%s\n' "$endpoint_digest" >> "$GITHUB_OUTPUT"

      - name: Promote endpoint image to catalog
        run: |
          python workers/promote-runpod-endpoint/release_tool.py promote-endpoint-image \
            --runtime-preset "${{ steps.contract.outputs.runtime_preset }}" \
            --workflow-id "${{ steps.contract.outputs.workflow_id }}" \
            --workflow-version "${{ steps.contract.outputs.workflow_version }}" \
            --catalog bundled/runtime-contracts.json \
            --workflow-catalog bundled/workflow-catalog.json \
            --contract-version "${{ steps.contract.outputs.contract_version }}" \
            --image-ref "${{ steps.digest.outputs.endpoint_ref }}"

      - name: Verify endpoint promotion PR scope
        run: |
          changed_paths="$(git status --porcelain --untracked-files=all | cut -c4-)"
          if ! printf '%s\n' "$changed_paths" | grep -qx 'bundled/runtime-contracts.json'; then
            echo "::error::Catalog promotion did not modify bundled/runtime-contracts.json"
            exit 1
          fi

          if ! printf '%s\n' "$changed_paths" | grep -qx 'bundled/workflow-catalog.json'; then
            echo "::error::Catalog promotion did not modify bundled/workflow-catalog.json"
            exit 1
          fi

          unexpected_paths="$(printf '%s\n' "$changed_paths" | sed '/^$/d' | grep -Evx 'bundled/(runtime-contracts|workflow-catalog)\.json' || true)"
          if [ -n "$unexpected_paths" ]; then
            echo "::error::Catalog promotion produced unexpected changed paths:"
            printf '%s\n' "$unexpected_paths"
            exit 1
          fi

      - name: Open endpoint promotion PR
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: |
            bundled/runtime-contracts.json
            bundled/workflow-catalog.json
          branch: runpod-endpoints/${{ steps.contract.outputs.contract_id }}-${{ steps.contract.outputs.contract_version }}
          title: "chore(workers): promote endpoint image ${{ steps.contract.outputs.contract_id }} ${{ steps.contract.outputs.contract_version }}"
          commit-message: "chore(workers): promote endpoint image ${{ steps.contract.outputs.contract_id }} ${{ steps.contract.outputs.contract_version }}"
          body: |
            Promotes the validated RunPod endpoint image and points the selected Workflow Preset revision at it.
          labels: runpod-endpoint
