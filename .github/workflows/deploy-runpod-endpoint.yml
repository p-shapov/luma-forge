name: Deploy RunPod Endpoint

on:
  push:
    tags:
      - "runpod-endpoint-v*"
  workflow_dispatch:
    inputs:
      workflow_id:
        description: Workflow ID
        required: true
        type: string
        default: comfyui-hidream-o1-dev
      workflow_revision:
        description: Workflow revision
        required: true
        type: string
        default: 1.0.0

permissions:
  contents: write
  packages: write
  pull-requests: write

concurrency:
  group: deploy-runpod-endpoint-${{ github.ref }}-${{ inputs.workflow_id || 'comfyui-hidream-o1-dev' }}-${{ inputs.workflow_revision || '1.0.0' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate, build, and publish RunPod endpoint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install release tooling
        run: python -m pip install --upgrade pip pyyaml jsonschema

      - name: Resolve endpoint build metadata
        id: contract
        env:
          WORKFLOW_ID: ${{ inputs.workflow_id || 'comfyui-hidream-o1-dev' }}
          WORKFLOW_REVISION: ${{ inputs.workflow_revision || '1.0.0' }}
        run: |
          python workers/runpod-endpoint/release_tool.py resolve \
            --catalog-root bundled/catalog \
            --workflow-id "$WORKFLOW_ID" \
            --workflow-revision "$WORKFLOW_REVISION" \
            --github-output "$GITHUB_OUTPUT"

      - name: Validate workers
        run: |
          python -m pip install workers/provisioner workers/runpod-endpoint pyyaml
          PYTHONPATH=workers/runpod-endpoint/src python -m unittest discover -s workers/runpod-endpoint/tests

      - name: Resolve image tags
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          CONTRACT_ID: ${{ steps.contract.outputs.contract_id }}
          CONTRACT_REVISION: ${{ steps.contract.outputs.contract_revision }}
        run: |
          base="ghcr.io/$(printf '%s' "${REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          suffix="${CONTRACT_ID}-${CONTRACT_REVISION}"
          printf 'endpoint_tag=%s\n' "${base}/runpod-endpoint-worker:${suffix}-sha-${SHA}" >> "$GITHUB_OUTPUT"

      - name: Build endpoint image
        run: |
          docker build --file workers/runpod-endpoint/Dockerfile --platform linux/amd64 \
            --build-arg LUMA_FORGE_RUNTIME_PYTHON_VERSION="${{ steps.contract.outputs.runtime_python_version }}" \
            --build-arg LUMA_FORGE_COMFYUI_REVISION="${{ steps.contract.outputs.comfyui_revision }}" \
            --build-arg LUMA_FORGE_PYTORCH_INDEX_URL="${{ steps.contract.outputs.pytorch_index_url }}" \
            --build-arg LUMA_FORGE_PYTORCH_PACKAGES_JSON='${{ steps.contract.outputs.pytorch_packages_json }}' \
            --build-arg LUMA_FORGE_WORKFLOW_PATH="${{ steps.contract.outputs.workflow_path }}" \
            --build-arg LUMA_FORGE_EXECUTION_CONTRACT_PATH="${{ steps.contract.outputs.execution_contract_path }}" \
            --build-arg LUMA_FORGE_EXECUTION_SCHEMA_PATH="${{ steps.contract.outputs.execution_schema_path }}" \
            --tag "${{ steps.image.outputs.endpoint_tag }}" .

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish endpoint image
        run: |
          for attempt in 1 2 3; do
            if docker push "${{ steps.image.outputs.endpoint_tag }}"; then
              exit 0
            fi

            if [ "$attempt" = "3" ]; then
              exit 1
            fi

            sleep "$((attempt * 30))"
          done

      - name: Resolve pushed image digests
        id: digest
        run: |
          endpoint_digest="$(docker inspect --format='{{index .RepoDigests 0}}' "${{ steps.image.outputs.endpoint_tag }}")"
          printf 'endpoint_ref=%s\n' "$endpoint_digest" >> "$GITHUB_OUTPUT"

      - name: Promote endpoint image to catalog
        id: promotion
        run: |
          python workers/runpod-endpoint/release_tool.py promote-endpoint-image \
            --catalog-root bundled/catalog \
            --workflow-id "${{ steps.contract.outputs.workflow_id }}" \
            --workflow-revision "${{ steps.contract.outputs.workflow_revision }}" \
            --contract-revision "${{ steps.contract.outputs.contract_revision }}" \
            --image-ref "${{ steps.digest.outputs.endpoint_ref }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Verify endpoint promotion PR scope
        run: |
          runtime_contract_path="${{ steps.promotion.outputs.runtime_contract_path }}"
          workflow_revision_path="${{ steps.promotion.outputs.workflow_revision_path }}"
          expected_paths="$(printf '%s\n' \
            "$runtime_contract_path" \
            "$workflow_revision_path/metadata" \
            "$workflow_revision_path/model_assets" \
            "$workflow_revision_path/contract_requirements" \
            "$workflow_revision_path/execution_contract" \
            "$workflow_revision_path/workflow" | sort)"
          changed_paths="$(git status --porcelain --untracked-files=all | cut -c4- | sort)"
          if [ "$changed_paths" != "$expected_paths" ]; then
            echo "::error::Catalog promotion did not produce the exact expected revisions"
            printf 'Expected:\n%s\nActual:\n%s\n' "$expected_paths" "$changed_paths"
            exit 1
          fi

      - name: Open endpoint promotion PR
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: |
            ${{ steps.promotion.outputs.runtime_contract_path }}
            ${{ steps.promotion.outputs.workflow_revision_path }}
          branch: runpod-endpoints/${{ steps.contract.outputs.contract_id }}-${{ steps.contract.outputs.contract_revision }}
          title: "chore(workers): promote endpoint image ${{ steps.contract.outputs.contract_id }} ${{ steps.contract.outputs.contract_revision }}"
          commit-message: "chore(workers): promote endpoint image ${{ steps.contract.outputs.contract_id }} ${{ steps.contract.outputs.contract_revision }}"
          body: |
            Promotes the validated RunPod endpoint image as immutable runtime contract and workflow revisions.
          labels: runpod-endpoint
