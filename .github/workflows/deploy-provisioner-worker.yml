name: Deploy Provisioner Worker

on:
  push:
    tags:
      - "worker-v*"
      - "provisioner-worker-v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-provisioner-worker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate, build, and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate worker
        working-directory: workers/provisioner
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          PYTHONPATH=src python -m unittest discover -s tests

      - name: Resolve image tags
        id: image
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          image="ghcr.io/$(printf '%s' "${REPOSITORY}/provisioner-worker" | tr '[:upper:]' '[:lower:]')"
          sha_tag="${image}:sha-${SHA}"
          version_tag=""

          if [ "$REF_TYPE" = "tag" ]; then
            version_tag="${image}:${REF_NAME}"
          fi

          printf 'image=%s\n' "$image" >> "$GITHUB_OUTPUT"
          printf 'sha_tag=%s\n' "$sha_tag" >> "$GITHUB_OUTPUT"
          printf 'version_tag=%s\n' "$version_tag" >> "$GITHUB_OUTPUT"

      - name: Build worker image for validation
        env:
          SHA_TAG: ${{ steps.image.outputs.sha_tag }}
          VERSION_TAG: ${{ steps.image.outputs.version_tag }}
        run: |
          docker build --file workers/provisioner/Dockerfile --tag "$SHA_TAG" workers/provisioner
          if [ -n "$VERSION_TAG" ]; then
            docker tag "$SHA_TAG" "$VERSION_TAG"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish worker image
        env:
          SHA_TAG: ${{ steps.image.outputs.sha_tag }}
          VERSION_TAG: ${{ steps.image.outputs.version_tag }}
        run: |
          docker push "$SHA_TAG"
          if [ -n "$VERSION_TAG" ]; then
            docker push "$VERSION_TAG"
          fi
