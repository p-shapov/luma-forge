name: Deploy Provisioner Worker

on:
  push:
    tags:
      - "provisioner-worker-v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-provisioner-worker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate, build, and publish provisioner
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate provisioner worker
        working-directory: workers/provisioner
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          PYTHONPATH=src python -m unittest discover -s tests

      - name: Resolve image tags
        id: image
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          base="ghcr.io/$(printf '%s' "${REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          provisioner_image="${base}/provisioner-worker"
          provisioner_sha_tag="${provisioner_image}:sha-${SHA}"
          provisioner_version_tag=""

          if [ "$REF_TYPE" = "tag" ]; then
            provisioner_version_tag="${provisioner_image}:${REF_NAME}"
          fi

          printf 'provisioner_image=%s\n' "$provisioner_image" >> "$GITHUB_OUTPUT"
          printf 'provisioner_sha_tag=%s\n' "$provisioner_sha_tag" >> "$GITHUB_OUTPUT"
          printf 'provisioner_version_tag=%s\n' "$provisioner_version_tag" >> "$GITHUB_OUTPUT"

      - name: Build provisioner image for validation
        env:
          PROVISIONER_SHA_TAG: ${{ steps.image.outputs.provisioner_sha_tag }}
          PROVISIONER_VERSION_TAG: ${{ steps.image.outputs.provisioner_version_tag }}
        run: |
          docker build --file workers/Dockerfile --target provisioner --tag "$PROVISIONER_SHA_TAG" .
          if [ -n "$PROVISIONER_VERSION_TAG" ]; then
            docker tag "$PROVISIONER_SHA_TAG" "$PROVISIONER_VERSION_TAG"
          fi

      - name: Smoke test provisioner image
        working-directory: workers/provisioner
        env:
          LUMA_FORGE_RUN_CONTAINER_SMOKE: "1"
          LUMA_FORGE_PROVISIONER_SMOKE_IMAGE: ${{ steps.image.outputs.provisioner_sha_tag }}
        run: PYTHONPATH=src python -m unittest tests.test_container_smoke

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish provisioner image
        env:
          PROVISIONER_SHA_TAG: ${{ steps.image.outputs.provisioner_sha_tag }}
          PROVISIONER_VERSION_TAG: ${{ steps.image.outputs.provisioner_version_tag }}
        run: |
          docker push "$PROVISIONER_SHA_TAG"
          if [ -n "$PROVISIONER_VERSION_TAG" ]; then
            docker push "$PROVISIONER_VERSION_TAG"
          fi
