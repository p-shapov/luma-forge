schema: spec-driven

context: |
  LumaForge is a macOS-only desktop app for provisioning remote GPU
  infrastructure and running ComfyUI workflows remotely. ML inference never
  runs locally.

  v1 supports only RunPod as the GPU Cloud Provider. LumaForge has no hosted
  backend; the Rust/Tauri native layer communicates directly with RunPod.

  React owns presentation, navigation, temporary UI state, and user interaction.
  React treats Native Layer responses as authoritative and must not persist,
  log, or re-expose secrets.

  The Tauri Native Layer owns secure storage, provider communication, durable
  state, validation, provider mutations, workflow orchestration, and consistency
  boundaries. Tauri commands are adapters over application-layer services.

  Domain source of truth:
  - spec/domain.md
  - spec/flows/gpu-cloud-provider-setup.md
  - spec/flows/workspace-setup.md
  - spec/flows/workspace-provisioning.md
  - spec/ubiquitous-language/*.md
  - spec/reference/* is planning reference only, not production contract.

  Critical invariants:
  - Provider API Keys must never appear in frontend state, logs, diagnostics, command responses, domain snapshots, or generated frontend types.
  - Native Layer owns all durable Workspace Catalog mutations.
  - Client-generated Workspace UUIDs are idempotency keys for Workspace creation.
  - Workspace Provisioning sync performs at most one safe action per sync and derives actions from durable Workspace metadata.
  - Provider Resources are never shared between Workspaces.
  - Failed Workspace recovery is cleanup-first in v1.

rules:
  proposal:
    - Keep proposals focused on one logical product/domain change.
    - Always include explicit non-goals for provider scope, local inference, hosted backend behavior, and cleanup boundaries when relevant.
    - Name capabilities in kebab-case and align them with domain concepts from spec/ubiquitous-language.
    - Do not propose React-owned durable state for Native-owned workflows.
    - Call out affected flows and whether the change modifies requirements or only implementation.

  specs:
    - Requirements must use domain vocabulary from spec/ubiquitous-language.
    - Scenarios must identify the authoritative actor for durable state changes.
    - Include failure, retry, idempotency, cancellation, and cleanup scenarios for provider-mutating flows.
    - Explicitly state secret-handling expectations for any provider credential path.
    - Avoid specifying GPU Cloud Provider API (eg RunPod API) shapes outside provider-specific implementation behavior unless the requirement truly depends on them.

  design:
    - Separate React, Tauri command adapter, application service, domain, infrastructure, persistence, keyring, and provider implementation responsibilities.
    - Treat generated specta/tauri-specta bindings as the frontend contract.
    - Keep provider-specific request/response mapping inside provider modules.
    - Document transaction, rollback, resume, and consistency boundaries for every durable mutation.

  tasks:
    - Split frontend and src-tauri work into separate task groups.
    - Include generated binding updates when native command contracts change.
    - Include focused tests for native workflows that mutate durable state or provider resources.
    - Include required verification commands for touched areas:
      frontend: bun run build; bun run lint --fix
      tauri: cargo test; cargo clippy --fix --allow-dirty --allow-staged; cargo fmt
