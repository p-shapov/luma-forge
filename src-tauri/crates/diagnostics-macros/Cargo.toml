[package]
name = "luma-diagnostics-macros"
version = "0.1.0"
edition = "2021"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "visit-mut"] }

[dev-dependencies]
async-trait = "0.1"
fastrace = { version = "0.7", features = ["enable"] }
log = { version = "0.4", features = ["kv"] }
trybuild = "1"
uuid = { version = "1", features = ["v4"] }
