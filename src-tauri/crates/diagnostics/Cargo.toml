[package]
name = "luma-diagnostics"
version = "0.1.0"
edition = "2021"

[dependencies]
fastrace = { version = "0.7", features = ["enable"] }
log = { version = "0.4", features = ["kv"] }
luma-diagnostics-macros = { path = "../diagnostics-macros" }
secrecy = "0.10"
time = "0.3"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
async-trait = "0.1"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
trybuild = "1"
