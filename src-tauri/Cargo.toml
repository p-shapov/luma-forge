[package]
name = "luma-forge"
version = "0.1.0"
description = "LumaForge native backend refactor shell"
authors = ["you"]
edition = "2021"

[lib]
name = "luma_forge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait = "0.1"
fastrace = { version = "0.7", features = ["enable"] }
hex = "0.4"
hmac = "0.12"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native-sync-persistent"] }
log = { version = "0.4", features = ["kv"] }
logforth = { version = "0.30", features = ["append-file", "bridge-log", "diagnostic-fastrace", "layout-json"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
specta = "=2.0.0-rc.24"
specta-typescript = "0.0.11"
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio-rustls"] }
tauri = { version = "2", features = [] }
tauri-plugin-mcp-bridge = "0.11"
tauri-plugin-opener = "2"
tauri-specta = { version = "=2.0.0-rc.24", features = ["derive", "typescript"] }
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "serde-well-known"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
uuid = { version = "1", features = ["v4"] }
