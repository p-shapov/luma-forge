[package]
name = "luma-forge"
version = "0.1.0"
description = "LumaForge native backend refactor shell"
authors = ["you"]
edition = "2021"

[lib]
name = "luma_forge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = "=2.0.0-rc.24"
specta-typescript = "0.0.11"
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio-rustls"] }
tauri = { version = "2", features = [] }
tauri-plugin-mcp-bridge = "0.11"
tauri-plugin-opener = "2"
tauri-specta = { version = "=2.0.0-rc.24", features = ["derive", "typescript"] }
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
