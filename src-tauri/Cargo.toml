[package]
name = "luma-forge"
version = "0.1.0"
description = "LumaForge native backend refactor shell"
authors = ["you"]
edition = "2021"

[lib]
name = "luma_forge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
prettyplease = "0.2"
schemars = "0.8"
serde_json = "1"
syn = "2"
tauri-build = { version = "2", features = [] }
typify = "0.7.0"

[dependencies]
async-trait = "0.1"
graphql_client = "0.16"
hex = "0.4"
hmac = "0.12"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native-sync-persistent"] }
log = { version = "0.4", features = ["kv"] }
logforth = { version = "0.30", features = ["append-file", "bridge-log", "diagnostic-fastrace", "layout-json"] }
luma-diagnostics = { path = "crates/diagnostics" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
regress = "0.11.1"
sea-orm = { version = "=2.0.0-rc.41", default-features = false, features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros", "entity-registry", "schema-sync", "with-time"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
specta = "=2.0.0-rc.24"
specta-typescript = "0.0.11"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-specta = { version = "=2.0.0-rc.24", features = ["derive", "typescript"] }
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "serde-well-known"] }
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread", "sync", "test-util", "time"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
fastrace = { version = "0.7", features = ["enable"] }
jsonschema = { version = "0.46.6", default-features = false }
